name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run assert:static
      - run: npm run build
      - name: Fail if secrets leaked into the static export
        run: |
          # supabase-js contains the prefixes sb_secret_ and the word service_role.
          # Ban key material (a secret key or a service_role JWT payload), not library source.
          if grep -RE 'sb_secret_[A-Za-z0-9]' out; then
            echo "A Supabase secret key must not appear in out/"
            exit 1
          fi
          if grep -R --fixed-strings "eyJyb2xlIjoic2VydmljZV9yb2xl" out; then
            echo "A service_role JWT must not appear in out/"
            exit 1
          fi
          if grep -R --fixed-strings "USDA_FDC_API_KEY" out; then
            echo "USDA_FDC_API_KEY must not appear in the Pages bundle"
            exit 1
          fi
      - name: Ensure .nojekyll shipped
        run: test -f out/.nojekyll
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require GitHub Pages (source = GitHub Actions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" != "200" ]; then
            echo "::error title=GitHub Pages is not enabled::Open https://github.com/${GITHUB_REPOSITORY}/settings/pages → Build and deployment → Source → GitHub Actions. Skip workflow templates (this repo already has pages.yml). Then re-run this workflow. Walkthrough: docs/wizard/github-pages.md or bash scripts/wizard-github-pages.sh"
            cat /tmp/pages.json
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
